<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            color: white;
            padding: 50px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }
        .btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #e68900;
        }
    </style>
   <script>
    function goToProfile() {
        const userId = localStorage.getItem("user_id"); // Fetch user_id when button is clicked
        if (userId) {
            location.href = `/api/profile/${userId}`;
        } else {
            alert("User ID not found. Please log in again.");
        }
    }


    </script>
</head>
<body>
    <h1>Welcome to Your Dashboard</h1>
    <div class="container">

         <button class="btn" onclick="goToProfile()">Go to Profile</button>
        <button class="btn" onclick="location.href='/api/upload'">Upload file</button>
        <button class="btn" onclick="location.href='/api/down'">Download file</button>
        <button class="btn" onclick="location.href='/api/update_status'">Update my profile</button>
         <button class="btn" onclick="location.href='/api/chatbot'">ChatBot</button>
        <button class="btn" onclick="location.href='/api/userinfo'">Search by Phone number</button>
    </div>
</body>
</html>
