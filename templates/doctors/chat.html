<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat API</title>
</head>
<body>
    <h2>Chatbot</h2>

    <form id="chatForm">
        <label for="text">Text:</label>
        <input type="text" id="text" name="text" required><br><br>

        <label for="id_file">File ID:</label>
        <input type="text" id="id_file" name="id_file"><br><br>

        <label for="image">Upload Image:</label>
        <input type="file" id="image" name="image" accept="image/*"><br><br>

        <label for="session_number">Session Number:</label>
        <input type="number" id="session_number" name="session_number" value="1"><br><br>

        <button type="submit">Send</button>
    </form>

    <h3>Response:</h3>
    <div id="response"></div>

    <script>
        document.getElementById("chatForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const text = document.getElementById("text").value;
            const idFile = document.getElementById("id_file").value;
            const sessionNumber = document.getElementById("session_number").value;
            const imageFile = document.getElementById("image").files[0];

            let base64Image = null;
            if (imageFile) {
                base64Image = await convertImageToBase64(imageFile);
            }

            const token = localStorage.getItem("access_token");
            if (!token) {
                showMessage("❌ You are not logged in. Please log in first.", "error");
                return;
            }

            const requestData = {
                text: text,
                id_file: idFile,
                image: base64Image,
                session_number: sessionNumber
            };

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(requestData)
                });



                const result = await response.json();

                if (response.ok) {
                   const sessionNumber = result.session_number ?? "N/A";
                    showMessage(`✅ Response: ${result.response}`, sessionNumber, "success");

                } else {
                    showMessage(`❌ Error: ${result.error || "Something went wrong"}`, "error");
                }
            } catch (error) {
                showMessage(`❌ Request failed: ${error.message}`, "error");
            }
        });

        function convertImageToBase64(imageFile) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(imageFile);
                reader.onload = () => resolve(reader.result.split(",")[1]);
                reader.onerror = error => reject(error);
            });
        }

        function showMessage(message,sessionNumber, type) {
            const responseDiv = document.getElementById("response");
            responseDiv.innerHTML =
            `<p style="color: ${type === 'error' ? 'red' : 'green'};">
            ${message} <br>

            📌 <strong>Session Number:</strong> ${sessionNumber}
        </p>`;

        }
    </script>
</body>
</html>
