<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.3-dist/css/bootstrap.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h1 class="card-title mb-4">User Profile</h1>
                        <p class="card-text"><strong>ID:</strong> {{ user.id }}</p>
                        <p class="card-text"><strong>Username:</strong> {{ user.username }}</p>
                        <p class="card-text"><strong>Role:</strong> {{ user.role }}</p>

                        {% if user.role == 'admin' %}
                            <button id="viewPendingFiles" class="btn btn-primary mt-3">
                                View Pending Files
                            </button>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>


        <div id="pendingFilesContainer" class="mt-4"></div>
    </div>

    <script src="{{ url_for('static', filename='bootstrap-5.3.3-dist/js/bootstrap.bundle.js') }}"></script>

    <script>
        document.getElementById('viewPendingFiles').addEventListener('click', function () {
            const token = localStorage.getItem('jwt_token'); // Get the JWT token

            if (!token) {
                alert('You are not logged in. Please log in again.');
                window.location.href = '/api/login'; // Redirect to login page
                return;
            }

            fetch('http://127.0.0.1:5001/api/get-all-files-users', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.status === 401) {
                    alert('Unauthorized: Please log in again.');
                    window.location.href = '/api/login';
                    return;
                }
                if (response.status === 403) {
                    alert('Access Denied: Only admins can view pending files.');
                    return;
                }
                return response.json();
            })
            .then(data => {
                if (!data || data.length === 0) {
                    alert('No pending files found.');
                    return;
                }
                displayFiles(data); // Call function to display files
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while fetching pending files.');
            });
        });

        function displayFiles(files) {
            let tableHtml = `
                <table class="table table-striped mt-3">
                    <thead>
                        <tr>
                            <th>File ID</th>
                            <th>Filename</th>
                            <th>Status</th>
                            <th>Username</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            files.forEach(file => {
                tableHtml += `
                    <tr>
                        <td>${file.file_id}</td>
                        <td>${file.filename}</td>
                        <td>${file.status}</td>
                        <td>${file.username}</td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="updateFileStatus('${file.file_id}', 'accept')">Accept</button>
                            <button class="btn btn-danger btn-sm" onclick="updateFileStatus('${file.file_id}', 'reject')">Reject</button>
                        </td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table>`;
            document.getElementById('pendingFilesContainer').innerHTML = tableHtml;
        }

        function updateFileStatus(fileId, action) {
            const token = localStorage.getItem('jwt_token'); // Get the JWT token

            if (!token) {
                alert('You are not logged in. Please log in again.');
                window.location.href = '/api/login'; // Redirect to login page
                return;
            }

            fetch('http://127.0.0.1:5001/api/update-file-status', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id_file: fileId,
                    accept_file: action
                })
            })
            .then(response => {
                if (response.status === 401) {
                    alert('Unauthorized: Please log in again.');
                    window.location.href = '/api/login';
                    return;
                }
                if (response.status === 403) {
                    alert('Access Denied: Only admins can update file status.');
                    return;
                }
                return response.json();
            })
            .then(data => {
                alert(data.message); // Show success or error message
                if (data.message.includes("successfully")) {
                    // Refresh the table to reflect the updated status
                    document.getElementById('viewPendingFiles').click();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while updating the file status.');
            });
        }
    </script>
</body>
</html>
