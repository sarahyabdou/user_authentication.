<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <style>
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Update Your Profile</h1>


    <div id="message" class="message"></div>


    <form id="update-profile-form">
        <label for="username">New Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter new username">
        <br><br>

        <label for="password">New Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter new password">
        <br><br>

        <button type="submit">Update Profile</button>
    </form>


    <script>
        document.getElementById('update-profile-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            // Get JWT token from localStorage (or sessionStorage)
            const token = localStorage.getItem('access_token');
            if (!token) {
                showMessage('You are not logged in. Please log in first.', 'error');
                return;
            }

            try {

              const response = await fetch('/api/update-profile', {
              method: 'POST',
              headers: {
              'Content-Type': 'application/json',
               'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(formData)
               });

                const result = await response.json();

                if (response.ok) {
                    showMessage(result.message, 'success');
                } else {
                    showMessage(result.error || 'Failed to update profile', 'error');
                }
            } catch (error) {
                showMessage('An error occurred. Please try again.', 'error');
                console.error('Error:', error);
            }
        });


        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
        }
    </script>
</body>
</html>
