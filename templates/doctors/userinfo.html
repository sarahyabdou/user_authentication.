<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get User by Phone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .container {
            margin-top: 50px;
        }
        .card {
            margin-top: 20px;
        }
        .file-list {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Get User by Phone</h1>
        <form id="userForm" class="mb-4">
            <div class="mb-3">
                <label for="phoneNumber" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phoneNumber" placeholder="Enter phone number" required>
            </div>
            <div class="mb-3">
                <label for="countryCode" class="form-label">Country Code</label>
                <input type="text" class="form-control" id="countryCode" placeholder="Enter country code (e.g., +20)" required>
            </div>
            <button type="submit" class="btn btn-primary">Get User</button>
        </form>

        <!-- Display User Information -->
        <div id="userInfo" class="card" style="display: none;">
            <div class="card-body">
                <h5 class="card-title">User Information</h5>
                <p><strong>ID:</strong> <span id="userId"></span></p>
                <p><strong>Name:</strong> <span id="userName"></span></p>
                <p><strong>Phone Number:</strong> <span id="userPhone"></span></p>
                <p><strong>Country Code:</strong> <span id="userCountryCode"></span></p>
            </div>
        </div>

        <!-- Display Files -->
        <div id="fileList" class="file-list" style="display: none;">
            <h5>Files</h5>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>File ID</th>
                        <th>File Name</th>
                        <th>Upload Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                </tbody>
            </table>
        </div>


        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("userForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const phoneNumber = document.getElementById("phoneNumber").value;
            const countryCode = document.getElementById("countryCode").value;
            const token = localStorage.getItem("jwt_token");

            if (!token) {
                alert("You are not logged in. Please log in again.");
                window.location.href = "/login";
                return;
            }

            try {
                const response = await fetch(`/api/get-user-by-phone?phone_number=${phoneNumber}&country_code=${countryCode}`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Failed to fetch user data");
                }

                const data = await response.json();


                document.getElementById("userId").textContent = data.user.id;
                document.getElementById("userName").textContent = data.user.name;
                document.getElementById("userPhone").textContent = data.user.phone_number;
                document.getElementById("userCountryCode").textContent = data.user.country_code;
                document.getElementById("userInfo").style.display = "block";


                const fileTableBody = document.getElementById("fileTableBody");
                fileTableBody.innerHTML = "";
                data.files.forEach(file => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${file.file_id}</td>
                        <td>${file.file_name}</td>
                        <td>${file.upload_date}</td>
                        <td>${file.status}</td>
                    `;
                    fileTableBody.appendChild(row);
                });
                document.getElementById("fileList").style.display = "block";


                document.getElementById("errorMessage").style.display = "none";
            } catch (error) {
                // Display Error Message
                document.getElementById("errorMessage").textContent = error.message;
                document.getElementById("errorMessage").style.display = "block";


                document.getElementById("userInfo").style.display = "none";
                document.getElementById("fileList").style.display = "none";
            }
        });
    </script>
</body>
</html>
