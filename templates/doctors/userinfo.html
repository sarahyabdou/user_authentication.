<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search User by Phone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script>
        async function searchUser(event) {
            event.preventDefault();

            const rawCountryCode = document.getElementById("country_code").value.trim();
            const phoneNumber = document.getElementById("phone_number").value.trim();
            const resultDiv = document.getElementById("result");

            if (!rawCountryCode || !phoneNumber) {
                resultDiv.innerHTML = '<p class="text-danger">Please enter both country code and phone number.</p>';
                return;
            }

            // Remove "+" if present
            const countryCode = rawCountryCode.startsWith("+") ? rawCountryCode.substring(1) : rawCountryCode;

            // Get JWT token
            const token = localStorage.getItem("jwt_token") || sessionStorage.getItem("jwt_token");
            if (!token) {
                resultDiv.innerHTML = '<p class="text-danger">Authentication required. Please log in.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/get-user-by-phone?country_code=${encodeURIComponent(countryCode)}&phone_number=${encodeURIComponent(phoneNumber)}`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    let filesHtml = "<h3 class='mt-4'>Files</h3>";
                    if (data.files.length > 0) {
                        filesHtml += `<table class='table table-striped'><thead><tr><th>File ID</th><th>File Name</th><th>Upload Date</th><th>Status</th></tr></thead><tbody>`;
                        data.files.forEach(file => {
                            filesHtml += `<tr><td>${file.file_id}</td><td>${file.file_name}</td><td>${file.upload_date || 'N/A'}</td><td>${file.status}</td></tr>`;
                        });
                        filesHtml += "</tbody></table>";
                    } else {
                        filesHtml += "<p>No files found for this user.</p>";
                    }

                    resultDiv.innerHTML = `
                        <div class="card p-3 mt-4">
                            <h5 class="card-title">User Details</h5>
                            <p><strong>ID:</strong> ${data.user.id}</p>
                            <p><strong>Name:</strong> ${data.user.name}</p>
                            <p><strong>Phone Number:</strong> ${data.user.phone_number}</p>
                            <p><strong>Country Code:</strong> ${data.user.country_code}</p>
                        </div>
                        ${filesHtml}
                    `;
                } else {
                    resultDiv.innerHTML = `<p class='text-danger mt-4'>${data.error || "Failed to fetch user data."}</p>`;
                }
            } catch (error) {
                console.error("Error fetching user data:", error);
                resultDiv.innerHTML = '<p class="text-danger">An error occurred. Please try again later.</p>';
            }
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Search User by Phone</h2>

        <form onsubmit="searchUser(event)">
            <div class="mb-3">
                <label for="country_code" class="form-label">Country Code</label>
                <input type="text" class="form-control" id="country_code" name="country_code" placeholder="+20" required>
            </div>
            <div class="mb-3">
                <label for="phone_number" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone_number" name="phone_number" required>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <div id="result" class="mt-4"></div>
    </div>
</body>
</html>
